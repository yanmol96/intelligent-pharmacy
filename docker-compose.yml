version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: pharmacy-postgres
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharmacy_user
      POSTGRES_PASSWORD: pharmacy_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pharmacy-redis
    ports:
      - "6379:6379"

  pharmacy-service:
    build: ./pharmacy-service
    container_name: pharmacy-service
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://pharmacy_user:pharmacy_pass@postgres:5432/pharmacy
      REDIS_HOST: redis

  ml-service:
    build: ./ml-service
    container_name: ml-service
    ports:
      - "8002:8000"
    volumes:
      - prescription_files:/data/prescriptions
    environment:
      DATABASE_URL: postgresql://pharmacy_user:pharmacy_pass@postgres:5432/pharmacy

  order-prescription-service:
    build: ./order-prescription-service
    container_name: order-prescription-service
    ports:
      - "8003:8000"
    depends_on:
    - postgres
    - rabbitmq
    environment:
      DATABASE_URL: postgresql://pharmacy_user:pharmacy_pass@postgres:5432/pharmacy
      RABBIT_HOST: rabbitmq
    volumes:
      - prescription_files:/data/prescriptions

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pharmacy-rabbitmq
    ports:
      - "15672:15672"   # Management UI

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    depends_on:
      - postgres
      - rabbitmq
    environment:
      DATABASE_URL: postgresql://pharmacy_user:pharmacy_pass@postgres:5432/pharmacy
      RABBIT_HOST: rabbitmq
      REDIS_HOST: redis
    ports:
      - "8004:8000"
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9000:8000"
    depends_on:
      - pharmacy-service
      - order-prescription-service
      - inventory-service
      - ml-service
  
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9100:9000"     # S3 API
      - "9001:9001"     # Console UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"







volumes:
  pgdata:
  prescription_files:
  minio_data: